<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <clipPath id="rounded-banner">
      <rect width="1200" height="300" rx="16" />
    </clipPath>
    <linearGradient id="dark-vignette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050507" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#050507" stop-opacity="0.55" />
      <stop offset="75%" stop-color="#450a0a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050507" stop-opacity="0.85" />
    </linearGradient>
    <style>
      .hero-name {
        font: 900 46px 'Segoe UI', 'Inter', system-ui, sans-serif;
        letter-spacing: 8px;
        fill: #ffffff;
      }
      .hero-sub {
        font: 700 14px 'JetBrains Mono', monospace;
        letter-spacing: 4px;
        fill: #ef4444;
      }
    </style>
  </defs>

  <g clip-path="url(#rounded-banner)">
    <!-- Hardcoded 4K Wallpaper with exact Y-axis offset crop -->
    <image 
      href="https://4kwallpapers.com/images/wallpapers/batman-red-3840x2160-19038.jpg" 
      width="1200" 
      height="675" 
      y="-165" 
      preserveAspectRatio="xMidYMid slice" 
    />
    
    <!-- Coded Dark/Crimson Gradient Overlay for Text Readability -->
    <rect width="1200" height="300" fill="url(#dark-vignette)" />

    <!-- Left-Aligned Cyber Accent Line -->
    <rect x="65" y="95" width="4" height="110" fill="#ef4444" rx="2" />

    <!-- Overlaid Coded Text -->
    <text x="90" y="148" class="hero-name">DIPANJAN BAIDYA</text>
    <text x="92" y="185" class="hero-sub">SOFTWARE • SYSTEMS • CREATIVE ENGINEERING</text>

    <!-- Outer Crimson Border -->
    <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#ef4444" stroke-opacity="0.4" stroke-width="2" />
  </g>
</svg>
