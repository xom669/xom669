<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Deep Dark Crimson Background Gradient -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040406" />
      <stop offset="50%" stop-color="#0f0306" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Intense Crimson Backlight Glow -->
    <radialGradient id="crimson-glow" cx="50%" cy="48%" r="52%" fx="50%" fy="48%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#991b1b" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#450a0a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Red Edge Glow Filter -->
    <filter id="red-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dc2626" stroke-width="0.6" stroke-opacity="0.12" />
    </pattern>

    <!-- Diagonal Gotham Rain Pattern -->
    <pattern id="rain" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="20" y1="0" x2="20" y2="35" stroke="#f87171" stroke-width="1" stroke-opacity="0.2" />
      <line x1="80" y1="45" x2="80" y2="90" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.12" />
      <line x1="50" y1="75" x2="50" y2="110" stroke="#dc2626" stroke-width="1.2" stroke-opacity="0.25" />
    </pattern>

    <!-- Metallic Text Gradient -->
    <linearGradient id="text-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>

    <style>
      .title {
        font: 900 48px 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        letter-spacing: 12px;
        fill: url(#text-metal);
      }
      .subtitle {
        font: 700 13px 'JetBrains Mono', 'Fira Code', monospace;
        letter-spacing: 5px;
        fill: #ef4444;
      }
      .hud {
        font: 600 11px 'JetBrains Mono', monospace;
        letter-spacing: 2px;
        fill: #7f1d1d;
      }
      .bat-symbol {
        fill: #070709;
        stroke: #dc2626;
        stroke-width: 2;
        filter: url(#red-bloom);
        animation: pulse 4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { stroke-opacity: 0.9; transform: scale(1); }
        50% { stroke-opacity: 0.45; transform: scale(0.99); }
      }
    </style>
  </defs>

  <!-- 1. Base Canvas & Grid -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-base)" />
  <rect width="1200" height="320" rx="16" fill="url(#cyber-grid)" />
  <rect width="1200" height="320" rx="16" fill="url(#crimson-glow)" />

  <!-- 2. Background Gotham Horizon Silhouette -->
  <polygon points="0,320 0,210 65,210 65,165 130,165 130,235 210,235 210,130 285,130 285,200 350,200 350,260 850,260 850,180 920,180 920,125 995,125 995,215 1075,215 1075,155 1145,155 1145,225 1200,225 1200,320" fill="#040406" opacity="0.85" />

  <!-- 3. Coded Batman Emblem Silhouette (Center Backlight) -->
  <g transform="translate(600, 148)" style="transform-origin: 600px 148px;">
    <path class="bat-symbol" d="M 0,-52 C -9,-52 -14,-35 -19,-26 C -19,-26 -24,-58 -29,-64 C -33,-52 -35,-24 -46,-20 C -92,-16 -155,-56 -235,-76 C -195,-14 -215,38 -255,68 C -175,32 -128,46 -104,76 C -76,42 -36,48 0,92 C 36,48 76,42 104,76 C 128,46 175,32 255,68 C 215,38 195,-14 235,-76 C 155,-56 92,-16 46,-20 C 35,-24 33,-52 29,-64 C 24,-58 19,-26 19,-26 C 14,-35 9,-52 0,-52 Z" />
  </g>

  <!-- 4. Atmospheric Rain Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#rain)" />

  <!-- 5. Dark Glassmorphism Foreground Card -->
  <rect x="220" y="72" width="760" height="176" rx="14" fill="#09090d" fill-opacity="0.72" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.2" />
  
  <!-- Subtle Corner Tech Brackets -->
  <path d="M 220,95 L 220,72 L 245,72" fill="none" stroke="#ef4444" stroke-width="2.5" />
  <path d="M 980,95 L 980,72 L 955,72" fill="none" stroke="#ef4444" stroke-width="2.5" />
  <path d="M 220,225 L 220,248 L 245,248" fill="none" stroke="#ef4444" stroke-width="2.5" />
  <path d="M 980,225 L 980,248 L 955,248" fill="none" stroke="#ef4444" stroke-width="2.5" />

  <!-- 6. glowing Eyes Accent above Typography -->
  <polygon points="572,102 592,107 576,110" fill="#ffffff" filter="url(#red-bloom)" />
  <polygon points="628,102 608,107 624,110" fill="#ffffff" filter="url(#red-bloom)" />

  <!-- 7. Main Typography -->
  <text x="606" y="168" text-anchor="middle" class="title">DIPANJAN BAIDYA</text>
  <text x="603" y="206" text-anchor="middle" class="subtitle">CS ENGINEERING • SYSTEMS • DEVELOPMENT</text>

  <!-- 8. HUD Telemetry Accents -->
  <text x="35" y="38" class="hud">SYS.LOC // KOLKATA_IN</text>
  <text x="35" y="295" class="hud">STATUS // DARK_KNIGHT_PROTOCOL_ACTIVE</text>
  <text x="1165" y="38" text-anchor="end" class="hud">BUILD // 2026.XOM669</text>
  <circle cx="1158" cy="291" r="4" fill="#ef4444" filter="url(#red-bloom)" />
  <text x="1145" y="295" text-anchor="end" class="hud">ONLINE</text>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#dc2626" stroke-opacity="0.3" stroke-width="2" />
</svg>
